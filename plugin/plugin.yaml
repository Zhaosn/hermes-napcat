name: napcat
label: 🐧 NapCat (QQ)
kind: platform
version: 0.3.0
description: >
  NapCat / OneBot 11 (QQ) gateway adapter for Hermes Agent.  Runs a
  reverse-WebSocket server that NapCat dials into (Universal role: API +
  events over one full-duplex connection) and relays messages between QQ
  groups/DMs and the Hermes agent.  Ships 48 `qq_*` tools covering
  messaging, group management, files, OCR, translation, and more.
author: shubyi
optional_env:
  - name: NAPCAT_ACCESS_TOKEN
    description: "NapCat reverse-WS 鉴权 Token — must match the token configured on the NapCat reverse-WebSocket item (blank = no auth)"
    prompt: "NapCat access token"
    password: true
  - name: NAPCAT_WS_PORT
    description: "Reverse-WebSocket listen port NapCat dials into (default 18801)"
    prompt: "NapCat reverse WS port"
    password: false
  - name: NAPCAT_WS_HOST
    description: "Reverse-WebSocket bind host (default 0.0.0.0)"
    prompt: "WS bind host"
    password: false
  - name: NAPCAT_WS_PATH
    description: "Reverse-WebSocket path (default /onebot/v11)"
    prompt: "WS path"
    password: false
  - name: NAPCAT_SELF_ID
    description: "Bot's own QQ number (auto-detected via get_login_info when empty)"
    prompt: "Bot QQ number (optional)"
    password: false
  - name: NAPCAT_DM_POLICY
    description: "Private-chat policy: open | allowlist | disabled (default allowlist)"
    prompt: "DM policy"
    password: false
  - name: NAPCAT_GROUP_POLICY
    description: "Group-chat policy: open | allowlist | disabled (default open)"
    prompt: "Group policy"
    password: false
  - name: NAPCAT_ALLOWED_USERS
    description: "Comma-separated QQ numbers allowed to DM the bot (also seeds allow_from)"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: NAPCAT_ADMINS
    description: "Comma-separated QQ numbers that may use admin-only qq_* tools"
    prompt: "Admins (comma-separated)"
    password: false
  - name: NAPCAT_ALLOW_ALL_USERS
    description: "Authorize all users at the gateway level (defaults to true; the adapter's dm/group policy still applies)"
    prompt: "Allow all users at gateway level?"
    password: false
  - name: NAPCAT_HOME_CHANNEL
    description: "Chat ID for cron / notification delivery (e.g. group:123456 or a QQ number)"
    prompt: "Home channel (optional)"
    password: false
